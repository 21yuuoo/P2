<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Virtual Phone</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#e9edf4,#b9bec8);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#111;-webkit-font-smoothing:antialiased}
.phone{width:min(402px,100vw);height:min(874px,100dvh);min-height:620px;margin:0 auto;border:7px solid #101010;border-radius:52px;overflow:hidden;position:relative;background:#f7f7f7;box-shadow:0 22px 60px #20283855} @media(min-width:500px){.phone{margin:12px auto;height:min(874px,calc(100vh - 24px))}}
.screen{height:100%;position:relative;overflow:hidden}.status{position:absolute;z-index:100;pointer-events:none;top:0;left:0;right:0;height:34px;padding:8px 21px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.1px}.island{position:absolute;z-index:101;pointer-events:none;top:7px;left:50%;transform:translateX(-50%);width:122px;height:29px;background:#000;border-radius:22px;box-shadow:inset 0 -1px 1px #222}
.view{height:100%;padding-top:32px;overflow:auto}.lock,.home{height:100%;background-size:cover;background-position:center}.lock{padding-top:66px;text-align:center;color:#fff;background-image:linear-gradient(#0001,#0003),linear-gradient(145deg,#9ed8ef,#8b9fe5 52%,#d6a5dd)}.lock .time{font-size:78px;font-weight:300;letter-spacing:-3px;text-shadow:0 2px 12px #0002}.lock .date{font-size:16px}.lockNotice{margin:28px 17px;text-align:left;background:#ffffffcc;color:#111;padding:12px 14px;border-radius:17px;backdrop-filter:blur(18px)}.unlock{position:absolute;bottom:45px;left:0;right:0;font-size:13px;text-shadow:0 1px 5px #0005}
.home{padding:64px 18px 100px;background-image:linear-gradient(145deg,#a9d9f5 0%,#7f9fe3 45%,#d5a7e8 100%)}.bigtime{text-align:center;color:white;font-size:60px;font-weight:300;letter-spacing:-2px;text-shadow:0 2px 8px #25345a44;margin:8px 0 32px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:23px 12px}.app{text-align:center;color:#fff;font-size:11px;text-shadow:0 1px 3px #333;cursor:pointer}.icon{width:60px;height:60px;margin:auto auto 5px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f5f5f7;box-shadow:0 1px 2px #0002,0 4px 9px #0002;text-shadow:none}.icon svg{display:block;width:100%;height:100%}.app{font-size:11px;font-weight:500;letter-spacing:-.15px;text-shadow:0 1px 3px #0007}.dock .icon{width:58px;height:58px;margin-bottom:0}.status{font-size:12px;font-variant-numeric:tabular-nums}.status .signals{display:flex;align-items:center;gap:5px}.status svg{display:block}.dock{position:absolute;bottom:14px;left:13px;right:13px;padding:10px 8px;border-radius:27px;background:#ffffff42;border:1px solid #ffffff35;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(4,1fr)}
.header{height:52px;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #ddd;background:#fafafa;position:sticky;top:0;z-index:5}.back{border:0;background:none;font-size:28px}.title{flex:1;text-align:center;font-weight:700;font-size:19px}.body{padding:15px}.row{display:flex;align-items:center;gap:11px;padding:12px 3px;border-bottom:1px solid #eee;cursor:pointer}.avatar{width:46px;height:46px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.small{font-size:12px;color:#777}.btn{border:0;border-radius:18px;padding:8px 12px;background:#0a84ff;color:#fff}.bubble{max-width:75%;padding:10px 13px;border-radius:18px;margin:5px 0;line-height:1.35}.me{margin-left:auto;background:#0a84ff;color:#fff}.them{margin-right:auto;background:#e5e5ea}.chat{display:flex;flex-direction:column;padding-bottom:70px}.compose{position:absolute;z-index:10;bottom:0;left:0;right:0;padding:8px;background:#fafafa;border-top:1px solid #ddd;display:flex;gap:6px}.compose input{flex:1;border:1px solid #ccc;border-radius:20px;padding:10px}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.photo{aspect-ratio:1;background:#ddd;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}
.ig{background:#fff;min-height:100%}.igtop{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #eee;font-size:21px;font-weight:800}.stories{display:flex;gap:13px;padding:12px 10px;overflow-x:auto;border-bottom:1px solid #eee}.story{min-width:62px;text-align:center;font-size:11px}.storyRing{width:58px;height:58px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f90,#e33,#c2c,#55f);margin:auto}.storyRing img,.storyRing .empty{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#ddd;display:flex;align-items:center;justify-content:center}.feed{padding-bottom:55px}.post{border-bottom:1px solid #ddd}.postHead{display:flex;align-items:center;padding:10px;gap:9px}.postPhoto{width:100%;aspect-ratio:1;object-fit:cover;background:#ddd;display:block}.postText{padding:10px}.igbottom{position:absolute;bottom:0;left:0;right:0;height:50px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;font-size:22px}.dmList .row{padding:14px 3px}.dmTop{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid #eee;font-weight:700}.storyViewer{position:absolute;inset:0;z-index:30;background:#111;color:#fff;display:flex;flex-direction:column}.storyViewer img{width:100%;height:100%;object-fit:contain}.storyClose{position:absolute;right:14px;top:43px;color:#fff;background:#0008;border:0;border-radius:20px;padding:8px;z-index:31}.storyName{position:absolute;top:43px;left:15px;z-index:31;font-weight:700}
.galleryPick{display:flex;gap:7px;overflow:auto}.pick{width:65px;height:65px;flex:none;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}.pick.sel{border-color:#08f}
.call{position:absolute;inset:0;z-index:40;background:#18231d;color:#fff;text-align:center;padding-top:105px}.call .big{font-size:80px}.call button{margin:90px 8px 0;width:66px;height:66px;border:0;border-radius:50%;font-size:24px}.end{background:#ff3b30;color:#fff}.subtitle{position:absolute;z-index:45;left:15px;right:15px;top:45%;background:#000c;color:#fff;padding:13px;border-radius:10px;text-align:center;font-size:18px}
.edit{position:absolute;right:10px;top:42px;z-index:9999;pointer-events:auto;cursor:pointer;border:0;background:#ffffffed;color:#007aff;border-radius:18px;padding:7px 11px;box-shadow:0 2px 8px #0002}.homebtn{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:116px;height:5px;background:#111;border-radius:5px;z-index:110;cursor:pointer}.modal{display:none;position:absolute;pointer-events:none;inset:0;z-index:150;background:#0008;align-items:flex-end}.panel{pointer-events:auto;width:100%;max-height:90%;overflow:auto;background:#f5f5f7;border-radius:24px 24px 0 0;padding:17px}.panel h3{margin-top:0}.field{margin:10px 0}.field label{font-size:12px;color:#666}.field input,.field textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin-top:4px}.field textarea{min-height:70px}.addline{border:0;border-radius:12px;background:#e5efff;color:#087aff;padding:8px 11px;margin-top:6px;font-weight:600}.hint{font-size:11px;color:#7a7a80;margin:4px 0 8px}.save{width:100%;padding:12px;border:0;border-radius:12px;background:#111;color:#fff}.close{float:right;border:0;border-radius:20px;padding:7px}.toast{position:absolute;z-index:130;top:65px;left:15px;right:15px;background:#fff9;backdrop-filter:blur(18px);padding:12px;border-radius:17px;box-shadow:0 5px 18px #0003}
</style></head>
<body><div class="phone"><div class="screen"><div class="status"><span id="clock">09:41</span><span class="signals"><svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M1 10.5h2V8H1zm4 0h2V5H5zm4 0h2V2H9zm4 0h2V.5h-2z" fill="currentColor"/></svg><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 4.2Q8-1.5 15 4.2L8 11z" fill="currentColor"/></svg><svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x=".5" y="1" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2.5" y="3" width="15" height="6" rx="1" fill="currentColor"/><path d="M22.5 4h2v4h-2z" fill="currentColor"/></svg></span></div><div class="island"></div><button id="editBtn" class="edit" type="button" onclick="openEditor();return false;" style="display:none">편집</button><div id="app"></div><div class="homebtn" onclick="homeUnlock()"></div><div id="modal" class="modal"><div class="panel"><button class="close" onclick="closeEditor()">닫기</button><h3>가상 아이폰 편집</h3><div id="editor"></div></div></div></div></div>
<script>
const base={contacts:[{name:"지민",phone:"010-1234-5678",emoji:"👩🏻",photo:""}],chats:{지민:[["them","뭐해?"]]},auto:{지민:"나 지금 집이야 ㅎㅎ"},photos:[],history:["가상 아이폰 만들기","오늘 날씨"],notes:[{title:"메모",text:"여기에 메모를 입력하세요."}],homeBg:"",lockBg:"",
ig:{account:"my_fake_account",stories:[{name:"지민",photo:""}],posts:[{caption:"오늘의 게시물 ✨",photo:""}],dm:{지민:[["them","안녕!"],["me","안녕 ㅎㅎ"]]},dmAuto:{지민:"답장 왔어!"}},
alerts:[],incomingCalls:[],incomingCall:null,subtitles:["여보세요?","응, 나야.","잠깐 얘기할 수 있어?"]};
let d=JSON.parse(localStorage.getItem("vphone3")||"null")||base,current="lock",chatName=null,dmName=null;
if(!Array.isArray(d.incomingCalls)) d.incomingCalls=d.incomingCall?[d.incomingCall]:[];
if(!Array.isArray(d.youtube)) d.youtube=["오늘 꼭 봐야 할 영상","브이로그 🎬","재미있는 영상 모음"];
const editMode=new URLSearchParams(location.search).has("edit");
window.addEventListener("DOMContentLoaded",()=>{const b=document.getElementById("editBtn");if(b)b.style.display=editMode?"block":"none";});
const apps=[["messages","messages","메시지"],["photos","photos","사진"],["youtube","youtube","YouTube"],["safari","safari","Safari"],["contacts","contacts","연락처"],["instagram","instagram","Instagram"],["notes","notes","메모"],["phone","phone","전화"]];
function appIcon(name){const icons={
messages:`<svg viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="msg" x2="0" y2="1"><stop stop-color="#62df68"/><stop offset="1" stop-color="#20b83b"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#msg)"/><path d="M30 11.5c-11 0-19 7.1-19 16.2 0 5 2.5 9.1 7 12.1l-1.6 7.1 8.1-4.1c1.8.5 3.6.8 5.5.8 10.9 0 19-7 19-15.9S40.9 11.5 30 11.5z" fill="#fff"/></svg>`,
photos:`<svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="14" fill="#fff"/><g transform="translate(30 30)"><ellipse cy="-10.5" rx="6.5" ry="11" fill="#ff453a"/><ellipse cx="10" cy="-3.2" rx="6.5" ry="11" transform="rotate(60 10 -3.2)" fill="#ff9500"/><ellipse cx="7" cy="8.5" rx="6.5" ry="11" transform="rotate(120 7 8.5)" fill="#ffd60a"/><ellipse cy="10.5" rx="6.5" ry="11" fill="#34c759"/><ellipse cx="-10" cy="-3.2" rx="6.5" ry="11" transform="rotate(-60 -10 -3.2)" fill="#00c7be"/><ellipse cx="-7" cy="8.5" rx="6.5" ry="11" transform="rotate(-120 -7 8.5)" fill="#0a84ff"/><circle r="5.3" fill="#fff"/></g></svg>`,
youtube:`<svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="14" fill="#fff"/><rect x="8" y="16" width="44" height="28" rx="9" fill="#ff0033"/><path d="M26 22.5 38 30l-12 7.5z" fill="#fff"/></svg>`,
safari:`<svg viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="saf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68d9ff"/><stop offset="1" stop-color="#0878e8"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#saf)"/><circle cx="30" cy="30" r="23" fill="#f8fcff" stroke="#c7e7ff" stroke-width="1.5"/><circle cx="30" cy="30" r="19.5" fill="none" stroke="#7ca9d7" stroke-width="1"/><path d="M37.8 19.5 32 32 20.2 40.5 26 28z" fill="#ff453a"/><path d="M37.8 19.5 26 28 20.2 40.5 32 32z" fill="#fff"/><circle cx="30" cy="30" r="2" fill="#2477c9"/></svg>`,
contacts:`<svg viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="con" x2="0" y2="1"><stop stop-color="#c8cbd0"/><stop offset="1" stop-color="#8c9199"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#con)"/><rect x="12" y="9" width="36" height="42" rx="5" fill="#fff"/><circle cx="30" cy="23" r="7" fill="#b9bec5"/><path d="M17 43c.8-7.4 5.6-11 13-11s12.2 3.6 13 11" fill="#b9bec5"/></svg>`,
instagram:`<svg viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="igicon" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffd776"/><stop offset=".35" stop-color="#f56040"/><stop offset=".65" stop-color="#c13584"/><stop offset="1" stop-color="#5851db"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#igicon)"/><rect x="12" y="12" width="36" height="36" rx="11" fill="none" stroke="#fff" stroke-width="3.6"/><circle cx="30" cy="30" r="8.5" fill="none" stroke="#fff" stroke-width="3.6"/><circle cx="41" cy="19.5" r="2.4" fill="#fff"/></svg>`,
notes:`<svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" rx="14" fill="#f4f4f4"/><path d="M12 8h36v44H12z" fill="#fff"/><path d="M12 8h36v10H12z" fill="#ffd84d"/><path d="M17 25h26M17 32h26M17 39h26M17 46h20" stroke="#d0d0d0" stroke-width="1.8" stroke-linecap="round"/></svg>`,
phone:`<svg viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="ph" x2="0" y2="1"><stop stop-color="#63df70"/><stop offset="1" stop-color="#24b842"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#ph)"/><path d="M20.2 12.5c-2.3-.5-5.2 3.3-5.5 5.9-.7 7.4 13.4 23.2 22.3 24.4 3 .4 7.1-2.5 7.4-5.1.2-1.5-7.3-6.2-9.2-6.2-1.4 0-2.7 2.8-4.1 2.5-2.8-.6-7.6-5.8-8-8.1-.2-1.4 2.3-2.5 2.5-4 .2-1.7-3.7-8.9-5.4-9.4z" fill="#fff"/></svg>`};return icons[name]||""}
function save(){localStorage.setItem("vphone3",JSON.stringify(d))}
function addLine(id,template="") { const el=document.getElementById(id); if(!el)return; el.value += (el.value.trim()?"\n":"")+template; el.focus(); }
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function clock(){let x=new Date();document.getElementById("clock").textContent=x.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false})}setInterval(clock,1000);clock();
function goHome(){current="home";render()}function homeUnlock(){if(current==="lock"){current="home";render()}else goHome()}
function head(t){return `<div class=header><button class=back onclick=goHome()>‹</button><div class=title>${t}</div></div>`}
function render(){let a=document.getElementById("app");
if(current==="lock"){a.innerHTML=`<div class="view lock" style="${d.lockBg?`background-image:linear-gradient(#0002,#0005),url('${d.lockBg}')`:''}"><div class=date>${new Date().toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"})}</div><div class=time>${document.getElementById("clock").textContent}</div><div class=unlock>⌃<br>밀어서 잠금 해제</div></div>`;return}
if(current==="home"){a.innerHTML=`<div class="view home" style="${d.homeBg?`background-image:linear-gradient(#0001,#0001),url('${d.homeBg}')`:''}"><div class=bigtime>${document.getElementById("clock").textContent}</div><div class=grid>${apps.map(x=>`<div class=app onclick="openApp('${x[0]}')"><div class=icon>${appIcon(x[1])}</div>${x[2]}</div>`).join("")}</div><div class=dock>${apps.slice(0,4).map(x=>`<div class=app onclick="openApp('${x[0]}')"><div class=icon>${appIcon(x[1])}</div></div>`).join("")}</div></div>`;return}
if(current==="messages")return messages();if(current==="chat")return chat();if(current==="contacts")return contacts();if(current==="photos")return photos();if(current==="youtube")return youtube();if(current==="safari")return safari();if(current==="notes")return notes();if(current==="instagram")return instagram();if(current==="igdm")return igdm();}
function openApp(x){if(x==="phone"){contacts();return}current=x;render()}
function messages(){document.getElementById("app").innerHTML=`<div class=view>${head("메시지")}<div class=body>${d.contacts.map(c=>`<div class=row onclick="openChat('${esc(c.name)}')"><div class=avatar>${c.photo?`<img src="${c.photo}">`:c.emoji}</div><div><b>${esc(c.name)}</b><div class=small>${esc(d.chats[c.name]?.at(-1)?.[1]||"")}</div></div></div>`).join("")}</div></div>`}
function openChat(n){chatName=n;current="chat";render()}
function chat(){let c=d.chats[chatName]||[];document.getElementById("app").innerHTML=`<div class=view>${head(chatName)}<div class="body chat">${c.map(x=>`<div class="bubble ${x[0]==="me"?"me":"them"}">${esc(x[1])}</div>`).join("")}</div><div class=compose><input id=msg placeholder="메시지"><button class=btn onclick=sendMsg()>전송</button></div></div>`}
function sendMsg(){let v=document.getElementById("msg").value.trim();if(!v)return;(d.chats[chatName]??=[]).push(["me",v]);save();render();setTimeout(()=>{d.chats[chatName].push(["them",d.auto[chatName]||"응!"]);save();render()},800)}
function contacts(){document.getElementById("app").innerHTML=`<div class=view>${head("연락처")}<div class=body>${d.contacts.map(c=>`<div class=row><div class=avatar>${c.photo?`<img src="${c.photo}">`:c.emoji}</div><div style="flex:1"><b>${esc(c.name)}</b><div class=small>${esc(c.phone)}</div></div><button class=btn onclick="outgoing('${esc(c.name)}')">📞</button></div>`).join("")}</div></div>`}
function outgoing(n){let c=d.contacts.find(x=>x.name===n);document.getElementById("app").innerHTML=`<div class=call><div class=small style=color:#ddd>발신 중</div><div class=big>${c.photo?`<img style="width:100px;height:100px;border-radius:50%;object-fit:cover" src="${c.photo}">`:c.emoji}</div><h2>${esc(c.name)}</h2><div>${esc(c.phone)}</div><button class=end onclick=goHome()>☎</button></div>`}
function photos(){document.getElementById("app").innerHTML=`<div class=view>${head("사진")}<div class=body><div class=photoGrid>${d.photos.map(p=>`<div class=photo><img src="${p}"></div>`).join("")||"<div class=card>편집에서 사진을 추가하세요 📷</div>"}</div></div></div>`}
function youtube(){document.getElementById("app").innerHTML=`<div class=view>${head("YouTube")}<div class=body>${d.youtube.map(x=>`<div class=card><div class=thumb>▶</div><b>${esc(x)}</b><div class=small>가상 영상</div></div>`).join("")}</div></div>`}
function safari(){document.getElementById("app").innerHTML=`<div class=view>${head("Safari")}<div class=body><div class=search><input id=s placeholder="검색 또는 웹사이트 주소"><button class=btn onclick=search()>검색</button></div><div class=card><b>검색 기록</b>${d.history.map(x=>`<div class=row>🕘 ${esc(x)}</div>`).join("")}</div></div></div>`}
function search(){let x=document.getElementById("s").value.trim();if(x){d.history.unshift(x);d.history=[...new Set(d.history)].slice(0,20);save();render()}}
function notes(){document.getElementById("app").innerHTML=`<div class=view>${head("메모")}<div class=body>${d.notes.map(n=>`<div class=card><b>${esc(n.title)}</b><p>${esc(n.text)}</p></div>`).join("")}</div></div>`}
function instagram(){let st=d.ig.stories.map((s,i)=>`<div class=story onclick="story(${i})"><div class=storyRing>${s.photo?`<img src="${s.photo}">`:`<div class=empty>👤</div>`}</div>${esc(s.name)}</div>`).join("");let posts=d.ig.posts.map((p,i)=>`<div class=post><div class=postHead><div class=avatar>👤</div><b>${esc(d.ig.account)}</b></div>${p.photo?`<img class=postPhoto src="${p.photo}">`:`<div class=postPhoto style="display:flex;align-items:center;justify-content:center;font-size:50px">📷</div>`}<div class=postText>♡　♡　↗<br><b>좋아요 128개</b><br>${esc(p.caption)}</div></div>`).join("");document.getElementById("app").innerHTML=`<div class=view ig><div class=igtop><span>Instagram</span><span>♡　＋</span></div><div class=stories>${st}</div><div class=feed>${posts}</div><div class=igbottom><span>⌂</span><span>⌕</span><span>＋</span><span onclick="dmList()">♡</span><span>◎</span></div></div>`}
function story(i){let s=d.ig.stories[i];document.getElementById("app").innerHTML=`<div class=storyViewer><div class=storyName>${esc(s.name)}</div><button class=storyClose onclick=instagram()>✕</button>${s.photo?`<img src="${s.photo}">`:`<div style="margin:auto;font-size:100px">📷</div>`}</div>`}
function dmList(){document.getElementById("app").innerHTML=`<div class=view>${head("Instagram DM")}<div class=body dmList>${Object.keys(d.ig.dm).map(n=>{let c=d.contacts.find(x=>x.name===n);return `<div class=row onclick="openDM('${esc(n)}')"><div class=avatar>${c?.photo?`<img src="${c.photo}">`:c?.emoji||"👤"}</div><div><b>${esc(n)}</b><div class=small>${esc(d.ig.dm[n].at(-1)?.[1]||"")}</div></div></div>`}).join("")||"<div class=card>DM 대화를 편집에서 추가하세요.</div>"}</div></div>`}
function openDM(n){dmName=n;current="igdm";render()}
function igdm(){let c=d.ig.dm[dmName]||[];document.getElementById("app").innerHTML=`<div class=view>${head(dmName)}<div class="body chat">${c.map(x=>`<div class="bubble ${x[0]==="me"?"me":"them"}">${esc(x[1])}</div>`).join("")}</div><div class=compose><input id=dmmsg placeholder="메시지"><button class=btn onclick=sendDM()>전송</button></div></div>`}
function sendDM(){let v=document.getElementById("dmmsg").value.trim();if(!v)return;(d.ig.dm[dmName]??=[]).push(["me",v]);save();render();setTimeout(()=>{d.ig.dm[dmName].push(["them",d.ig.dmAuto[dmName]||"답장 왔어!"]);save();render()},800)}
function openEditor(){document.getElementById("modal").style.display="flex";document.getElementById("editor").innerHTML=`
<div class=field><label>홈 화면 배경</label><input type=file accept="image/*" onchange="fileBg(event,'home')"></div>
<div class=field><label>잠금화면 배경</label><input type=file accept="image/*" onchange="fileBg(event,'lock')"></div>
<div class=field><label>사진 앱 사진 추가</label><input type=file accept="image/*" multiple onchange="addPhotos(event)"></div>
<hr><h4>연락처</h4><div class=field><label>이름|번호|이모지|사진 URL(선택)</label><textarea id=contacts>${d.contacts.map(c=>`${c.name}|${c.phone}|${c.emoji}|${c.photo}`).join("\n")}</textarea><button class=addline onclick="addLine('contacts','새 연락처|010-0000-0000|👤|')">＋ 연락처 추가</button><div class=hint>한 줄에 한 명씩 추가할 수 있어.</div></div>
<div class=field><label>메시지 대화 — 상대이름|보낸사람(me/them)|내용</label><textarea id=chatData>${Object.entries(d.chats).flatMap(([n,arr])=>arr.map(x=>`${n}|${x[0]}|${x[1]}`)).join("\n")}</textarea><button class=addline onclick="addLine('chatData','지민|them|새 메시지 내용')">＋ 메시지 대화 추가</button></div><div class=field><label>메시지 자동답장 — 이름|답장</label><textarea id=auto>${Object.entries(d.auto).map(x=>x[0]+"|"+x[1]).join("\n")}</textarea><button class=addline onclick="addLine('auto','이름|자동 답장 내용')">＋ 자동답장 추가</button></div>
<hr><h4>YouTube</h4><div class=field><label>영상 제목 — 한 줄에 하나씩</label><textarea id=youtubeData>${d.youtube.join("\n")}</textarea><button class=addline onclick="addLine('youtubeData','새 영상 제목')">＋ 영상 추가</button></div><hr><h4>Instagram</h4>
<div class=field><label>계정 이름</label><input id=igAccount value="${esc(d.ig.account)}"></div>
<div class=field><label>스토리 — 이름|사진 URL</label><textarea id=stories>${d.ig.stories.map(s=>`${s.name}|${s.photo}`).join("\n")}</textarea><button class=addline onclick="addLine('stories','스토리 이름|사진 URL')">＋ 스토리 추가</button></div>
<div class=field><label>피드 — 글내용|사진 URL</label><textarea id=posts>${d.ig.posts.map(p=>`${p.caption}|${p.photo}`).join("\n")}</textarea><button class=addline onclick="addLine('posts','게시물 내용|사진 URL')">＋ 게시물 추가</button></div>
<div class=field><label>DM 상대방 — 이름|자동답장</label><textarea id=dmAuto>${Object.entries(d.ig.dmAuto).map(x=>x[0]+"|"+x[1]).join("\n")}</textarea><button class=addline onclick="addLine('dmAuto','상대 이름|DM 자동답장')">＋ DM 상대 추가</button></div>
<div class=field><label>DM 대화 — 상대이름|보낸사람(me/them)|내용</label><textarea id=dmData>${Object.entries(d.ig.dm).flatMap(([n,arr])=>arr.map(x=>`${n}|${x[0]}|${x[1]}`)).join("\n")}</textarea><button class=addline onclick="addLine('dmData','상대 이름|them|메시지 내용')">＋ DM 메시지 추가</button></div>
<p class=small>스토리/피드/프로필 사진은 사진 앱에 추가한 사진을 URL로 연결하거나, 아래 파일 선택으로 새 사진을 추가할 수 있어.</p>
<div class=field><label>새 스토리 사진</label><input type=file accept="image/*" onchange="storyPhoto(event)"></div>
<div class=field><label>새 피드 사진</label><input type=file accept="image/*" onchange="postPhoto(event)"></div>
<hr><h4>알림 예약</h4><div class=field><label>종류(message/dm)|제목|내용|지연초</label><textarea id=alerts>${d.alerts.map(a=>`${a.type}|${a.title}|${a.text}|${a.delay}`).join("\n")}</textarea><button class=addline onclick="addLine('alerts','message|알림 제목|알림 내용|10')">＋ 예약 알림 추가</button><div class=hint>여러 개를 추가할 수 있어. 마지막 숫자는 사이트를 연 뒤 알림이 뜰 때까지의 초야.</div></div>
<hr><h4>수신 전화 예약</h4><div class=field><label>상대 이름|지연초 (한 줄에 전화 하나)</label><textarea id=inCalls>${d.incomingCalls.map(c=>`${c.name}|${c.delay}`).join("\n")}</textarea><button class=addline onclick="addLine('inCalls','지민|15')">＋ 수신 전화 추가</button></div>
<div class=field><label>통화 자막 — 한 줄씩 순서대로</label><textarea id=subs>${d.subtitles.join("\n")}</textarea><button class=addline onclick="addLine('subs','새 대사')">＋ 자막 추가</button></div>
<hr><h4>Safari / 메모</h4><div class=field><label>검색기록</label><textarea id=hist>${d.history.join("\n")}</textarea><button class=addline onclick="addLine('hist','새 검색 기록')">＋ 검색 기록 추가</button></div>
<div class=field><label>메모 — 제목|내용</label><textarea id=notes>${d.notes.map(n=>`${n.title}|${n.text}`).join("\n")}</textarea><button class=addline onclick="addLine('notes','새 메모|메모 내용')">＋ 메모 추가</button></div>
<button class=save onclick="saveEditor()">저장</button>`;
document.getElementById("modal").style.display="flex"}
function closeEditor(){document.getElementById("modal").style.display="none"}
function fileBg(e,k){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{d[k+"Bg"]=r.result;save();render()};r.readAsDataURL(f)}
function addPhotos(e){[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{d.photos.push(r.result);save();render()};r.readAsDataURL(f)})}
function storyPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{d.ig.stories.push({name:"새 스토리",photo:r.result});save()};r.readAsDataURL(f)}
function postPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{d.ig.posts.push({caption:"새 게시물",photo:r.result});save()};r.readAsDataURL(f)}
function saveEditor(){
d.contacts=document.getElementById("contacts").value.split("\n").filter(Boolean).map(x=>{let [name,phone,emoji="👤",photo=""]=x.split("|");return{name,phone,emoji,photo}});
d.chats={};document.getElementById("chatData").value.split("\n").filter(Boolean).forEach(x=>{let [n,who,...v]=x.split("|");(d.chats[n]??=[]).push([who,v.join("|")])});
d.auto={};document.getElementById("auto").value.split("\n").filter(Boolean).forEach(x=>{let [k,...v]=x.split("|");d.auto[k]=v.join("|")});
d.youtube=document.getElementById("youtubeData").value.split("\n").filter(Boolean);
d.ig.account=document.getElementById("igAccount").value;
d.ig.stories=document.getElementById("stories").value.split("\n").filter(Boolean).map(x=>{let [name,photo=""]=x.split("|");return{name,photo}});
d.ig.posts=document.getElementById("posts").value.split("\n").filter(Boolean).map(x=>{let [caption,...p]=x.split("|");return{caption,photo:p.join("|")}});
d.ig.dmAuto={};document.getElementById("dmAuto").value.split("\n").filter(Boolean).forEach(x=>{let [k,...v]=x.split("|");d.ig.dmAuto[k]=v.join("|")});
d.ig.dm={};document.getElementById("dmData").value.split("\n").filter(Boolean).forEach(x=>{let [n,who,...v]=x.split("|");(d.ig.dm[n]??=[]).push([who,v.join("|")])});
d.alerts=document.getElementById("alerts").value.split("\n").filter(Boolean).map(x=>{let [type,title,text,delay]=x.split("|");return{type,title,text,delay:Number(delay)||0}});
d.incomingCalls=document.getElementById("inCalls").value.split("\n").filter(Boolean).map(x=>{let [name,delay]=x.split("|");return{name,delay:Number(delay)||0}});d.incomingCall=d.incomingCalls[0]||null;
d.subtitles=document.getElementById("subs").value.split("\n").filter(Boolean);d.history=document.getElementById("hist").value.split("\n").filter(Boolean);
d.notes=document.getElementById("notes").value.split("\n").filter(Boolean).map(x=>{let[t,...v]=x.split("|");return{title:t,text:v.join("|")}});
save();closeEditor();schedule();render()}
let scheduledTimers=[];function schedule(){scheduledTimers.forEach(clearTimeout);scheduledTimers=[];d.alerts.forEach(a=>scheduledTimers.push(setTimeout(()=>alertToast(a),Math.max(0,a.delay)*1000)));(d.incomingCalls|| (d.incomingCall?[d.incomingCall]:[])).forEach(c=>scheduledTimers.push(setTimeout(()=>incoming(c.name),Math.max(0,c.delay)*1000)))}
function alertToast(a){let t=document.createElement("div");t.className="toast";t.innerHTML=`<b>${a.type==="dm"?"📷 Instagram DM":"💬 메시지"}</b><br>${esc(a.title)}<div class=small>${esc(a.text)}</div>`;document.querySelector(".screen").appendChild(t);setTimeout(()=>t.remove(),6500)}
function incoming(n){let c=d.contacts.find(x=>x.name===n)||d.contacts[0];document.getElementById("app").innerHTML=`<div class=call style="background:#f4f4f7;color:#111"><div>수신 전화</div><div class=big>${c.photo?`<img style="width:100px;height:100px;border-radius:50%;object-fit:cover" src="${c.photo}">`:c.emoji}</div><h2>${esc(c.name)}</h2><div>${esc(c.phone)}</div><button onclick="answer('${esc(c.name)}')">☎</button><button class=end onclick=goHome()>✕</button></div>`}
function answer(n){let c=d.contacts.find(x=>x.name===n)||d.contacts[0];document.getElementById("app").innerHTML=`<div class=call><div class=small style=color:#ddd>통화 중</div><div class=big>${c.emoji}</div><h2>${esc(c.name)}</h2><div id=sub class=subtitle>${esc(d.subtitles[0]||"")}</div><button class=end onclick=goHome()>☎</button></div>`;d.subtitles.slice(1).forEach((s,i)=>setTimeout(()=>{let el=document.getElementById("sub");if(el)el.textContent=s},(i+1)*1800))}
if(!editMode)schedule();render();
</script></body></html>
